<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sở Thích Cá Nhân - Động Vật</title>
</head>
<body>

    <!-- Thẻ ngữ nghĩa 1: header -->
    <header>
        <h1>Thế Giới Của Những Loài Mèo</h1>
    </header>

    <!-- Thẻ ngữ nghĩa 2: main -->
    <main>
        <section>
            <h2>3 Giống Mèo Phổ Biến Nhất</h2>
            <!-- Danh sách ít nhất 3 mục -->
            <ul>
                <li>Mèo Anh Lông Ngắn (British Shorthair)</li>
                <li>Mèo Ba Tư (Persian Cat)</li>
                <li>Mèo Xiêm (Siamese Cat)</li>
            </ul>
        </section>

        <section>
            <h2>Hình Ảnh Các Giống Mèo</h2>
            <!-- 3 hình ảnh sử dụng URL trực tuyến -->
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300" alt="Mèo mướp dễ thương" width="200">
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=300" alt="Mèo Anh lông ngắn" width="200">
            <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=300" alt="Mèo đeo kính cool ngầu" width="200">
        </section>

        <!-- Thẻ ngữ nghĩa 3: footer -->
        <footer>
            <p>Tìm hiểu chi tiết hơn về cách chăm sóc mèo tại 
                <!-- Liên kết ngoài -->
                <a href="https://www.wikipedia.org" target="_blank">Trang tin Wikipedia</a>.
            </p>
        </footer>
    </main>

</body>
</html>
